name: S1 Runtime Profile Boundary

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  s1-profile-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    env:
      RUNTIME_SUPABASE_URL: ${{ secrets.RUNTIME_SUPABASE_URL }}
      RUNTIME_SUPABASE_ANON_KEY: ${{ secrets.RUNTIME_SUPABASE_ANON_KEY }}
      RUNTIME_STUDENT_MINOR_A_EMAIL: ${{ secrets.RUNTIME_STUDENT_MINOR_A_EMAIL }}
      RUNTIME_STUDENT_MINOR_A_PASSWORD: ${{ secrets.RUNTIME_STUDENT_MINOR_A_PASSWORD }}
      RUNTIME_STUDENT_ADULT_A_EMAIL: ${{ secrets.RUNTIME_STUDENT_ADULT_A_EMAIL }}
      RUNTIME_STUDENT_ADULT_A_PASSWORD: ${{ secrets.RUNTIME_STUDENT_ADULT_A_PASSWORD }}
      RUNTIME_STUDENT_SCHOOL_B_EMAIL: ${{ secrets.RUNTIME_STUDENT_SCHOOL_B_EMAIL }}
      RUNTIME_STUDENT_SCHOOL_B_PASSWORD: ${{ secrets.RUNTIME_STUDENT_SCHOOL_B_PASSWORD }}
      RUNTIME_SCHOOL_A_EMAIL: ${{ secrets.RUNTIME_SCHOOL_A_EMAIL }}
      RUNTIME_SCHOOL_A_PASSWORD: ${{ secrets.RUNTIME_SCHOOL_A_PASSWORD }}
      RUNTIME_SCHOOL_B_EMAIL: ${{ secrets.RUNTIME_SCHOOL_B_EMAIL }}
      RUNTIME_SCHOOL_B_PASSWORD: ${{ secrets.RUNTIME_SCHOOL_B_PASSWORD }}
      RUNTIME_COMPANY_A_EMAIL: ${{ secrets.RUNTIME_COMPANY_A_EMAIL }}
      RUNTIME_COMPANY_A_PASSWORD: ${{ secrets.RUNTIME_COMPANY_A_PASSWORD }}
      RUNTIME_COMPANY_B_EMAIL: ${{ secrets.RUNTIME_COMPANY_B_EMAIL }}
      RUNTIME_COMPANY_B_PASSWORD: ${{ secrets.RUNTIME_COMPANY_B_PASSWORD }}
      RUNTIME_EXTERNAL_A_EMAIL: ${{ secrets.RUNTIME_EXTERNAL_A_EMAIL }}
      RUNTIME_EXTERNAL_A_PASSWORD: ${{ secrets.RUNTIME_EXTERNAL_A_PASSWORD }}
      RUNTIME_SUSPENDED_EMAIL: ${{ secrets.RUNTIME_SUSPENDED_EMAIL }}
      RUNTIME_SUSPENDED_PASSWORD: ${{ secrets.RUNTIME_SUSPENDED_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install web dependencies
        run: npm ci --prefix apps/web

      - name: Verify S1 profile boundary structure
        run: npm run verify:authenticated-profile-boundary

      - name: Verify S1 evidence structure
        run: npm run verify:profile-evidence

      - name: Verify S1 runtime profile boundary
        run: npm run verify:runtime-profile-boundary
