name: Runtime Security Smoke Tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    env:
      RUNTIME_SUPABASE_URL: ${{ secrets.RUNTIME_SUPABASE_URL }}
      RUNTIME_SUPABASE_ANON_KEY: ${{ secrets.RUNTIME_SUPABASE_ANON_KEY }}
      RUNTIME_STUDENT_EMAIL: ${{ secrets.RUNTIME_STUDENT_EMAIL }}
      RUNTIME_STUDENT_PASSWORD: ${{ secrets.RUNTIME_STUDENT_PASSWORD }}
      RUNTIME_COMPANY_EMAIL: ${{ secrets.RUNTIME_COMPANY_EMAIL }}
      RUNTIME_COMPANY_PASSWORD: ${{ secrets.RUNTIME_COMPANY_PASSWORD }}
      RUNTIME_SCHOOL_EMAIL: ${{ secrets.RUNTIME_SCHOOL_EMAIL }}
      RUNTIME_SCHOOL_PASSWORD: ${{ secrets.RUNTIME_SCHOOL_PASSWORD }}
      RUNTIME_EXTERNAL_EMAIL: ${{ secrets.RUNTIME_EXTERNAL_EMAIL }}
      RUNTIME_EXTERNAL_PASSWORD: ${{ secrets.RUNTIME_EXTERNAL_PASSWORD }}
      RUNTIME_SECOND_SCHOOL_EMAIL: ${{ secrets.RUNTIME_SECOND_SCHOOL_EMAIL }}
      RUNTIME_SECOND_SCHOOL_PASSWORD: ${{ secrets.RUNTIME_SECOND_SCHOOL_PASSWORD }}
      RUNTIME_SECOND_STUDENT_EMAIL: ${{ secrets.RUNTIME_SECOND_STUDENT_EMAIL }}
      RUNTIME_SECOND_STUDENT_PASSWORD: ${{ secrets.RUNTIME_SECOND_STUDENT_PASSWORD }}
      RUNTIME_PENDING_CONTACT_REQUEST_ID: ${{ secrets.RUNTIME_PENDING_CONTACT_REQUEST_ID }}
      RUNTIME_FEED_POST_ID: ${{ secrets.RUNTIME_FEED_POST_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install web dependencies
        run: npm ci --prefix apps/web

      - name: Verify profile boundary migration contract
        run: npm run verify:authenticated-profile-boundary

      - name: Run runtime security matrix
        run: npm run verify:runtime-security

      - name: Run profile boundary staging matrix
        run: npm run verify:runtime-profile-boundary
        env:
          RUNTIME_SUSPENDED_EMAIL: ${{ secrets.RUNTIME_SUSPENDED_EMAIL }}
          RUNTIME_SUSPENDED_PASSWORD: ${{ secrets.RUNTIME_SUSPENDED_PASSWORD }}
          RUNTIME_SECOND_SCHOOL_EMAIL: ${{ secrets.RUNTIME_SECOND_SCHOOL_EMAIL }}
          RUNTIME_SECOND_SCHOOL_PASSWORD: ${{ secrets.RUNTIME_SECOND_SCHOOL_PASSWORD }}
          RUNTIME_SECOND_STUDENT_EMAIL: ${{ secrets.RUNTIME_SECOND_STUDENT_EMAIL }}
          RUNTIME_SECOND_STUDENT_PASSWORD: ${{ secrets.RUNTIME_SECOND_STUDENT_PASSWORD }}

      - name: Run feed RPC smoke test
        run: npm run verify:runtime-feed-rpcs
